name = "doxomachy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[durable_objects]
bindings = [{ name = "MIND", class_name = "Mind" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mind"]

[[d1_databases]]
binding = "DB"
database_name = "doxomachy"
database_id = "4403ece3-23ae-4c32-84fc-4a76fda7745b"

[ai]
binding = "AI"

[triggers]
# Every 6h (UTC). One diary per UTC day of the scheduled event; later ticks
# that day short-circuit, so a missed or failed run self-heals on the next tick.
crons = ["0 */6 * * *"]

[vars]
WEB_ORIGIN = "https://doxomachy.flcrom.dev"
WEB_ORIGINS = "https://doxomachy.flcrom.dev,https://doxomachy.vercel.app"
DIARY_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

WEB_ORIGIN_EXTRA = "https://doxomachy.vercel.app"

# Auth configuration (magic-link sign-in):
#   AUTH_FROM                 - verified sender, e.g. "Doxomachy <login@account.flcrom.dev>" (var, set once decided)
#   RESEND_API_KEY            - secret: wrangler secret put RESEND_API_KEY
#   AUTH_EMAIL_PEPPER         - secret: wrangler secret put AUTH_EMAIL_PEPPER (32+ random bytes; store a backup in the vault; without it every account lookup key is orphaned)
#   AUTH_EMAIL_PEPPER_PREVIOUS - secret, only during rotation: comma-separated key ring of outgoing peppers, tried in order; existing accounts resolve through them and rows are lazily re-keyed to AUTH_EMAIL_PEPPER on next use. Remove an entry ONLY after the pepper_id gate query in docs/operations-runbook.md returns 0 rows for it - dormant paid accounts may need it indefinitely.
# WEB_ORIGIN is the canonical origin (magic-link base); WEB_ORIGIN_EXTRA lists cutover origins. All must be https.

# --- Dodo Payments (TEST MODE ONLY) ---------------------------------------
# Live payments stay disabled until the owner finishes Dodo KYC/bank payout
# and explicitly flips these. Secrets go in via `wrangler secret put`:
#   DODO_API_KEY          test-mode API key (Developer -> API Keys)
#   DODO_WEBHOOK_SECRET   test-mode webhook signing secret, whsec_... (Developer -> Webhooks -> endpoint Overview)
DODO_API_BASE = "https://test.dodopayments.com"
DODO_PRODUCT_ID = "" # TEST-mode product id for the $5 five-move pack; set after the product exists
DODO_RETURN_URL = "https://doxomachy.vercel.app/pricing.html?checkout=return"
DODO_CHECKOUT_ENABLED = "false" # keep "false" until the owner approves paid checkout
DODO_BUSINESS_ID = "" # optional: when set, webhook events with a missing or different business_id are rejected

# Application logs are allowlisted JSON emitted by src/observability.ts.
# Invocation logs stay disabled: they would record request metadata such as
# client IP addresses, which the product privacy posture does not need.
# Workers Free includes 200,000 log events/day with 3-day retention.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
